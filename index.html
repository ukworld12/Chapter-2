<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 2 Financial System Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:900px;margin:auto}
header,.question,.results{background:white;padding:20px;border-radius:14px;margin-bottom:15px;box-shadow:0 4px 14px #17203312}
h1{font-size:1.55rem;margin:0 0 8px}.muted{color:#64748b;line-height:1.5}.progress{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#2563eb;width:0}
.qtitle{font-weight:bold;line-height:1.45;margin-bottom:12px}.option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #dbe3ef;border-radius:10px;margin:8px 0;cursor:pointer;line-height:1.4}.option:hover{background:#f8fafc}.option input{margin-top:3px;accent-color:#2563eb}.option.correct{border-color:#16a34a;background:#f0fdf4}.option.incorrect{border-color:#dc2626;background:#fef2f2}.mark{margin-left:auto;font-weight:bold;white-space:nowrap}.green{color:#15803d}.red{color:#b91c1c}
button{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:white;font-weight:bold;font-size:1rem;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#475569}button:disabled{opacity:.5;cursor:default}.hidden{display:none}.score{font-size:1.35rem;font-weight:bold}.resultrow{padding:13px 0;border-top:1px solid #e2e8f0;line-height:1.5}.pill{display:inline-block;border-radius:20px;padding:5px 10px;font-size:.85rem;font-weight:bold}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}
@media(max-width:560px){body{padding:9px}header,.question,.results{padding:14px}.mark{font-size:.8rem}}
</style></head><body><div class="wrap">
<header><h1>Chapter 2: Overview of the Financial System</h1>
<p class="muted">30 multiple-choice questions. Select one answer for each question, then submit to see your score and all correct/incorrect answers. Green ✓ marks the correct answer; red ✗ marks your incorrect choice.</p>
<div id="progressText" class="muted">0 of 30 answered</div><div class="progress"><div id="bar" class="bar"></div></div></header>
<form id="quiz"></form><button type="button" id="submitBtn">Submit Quiz &amp; Show Answers</button><button type="button" class="secondary" id="resetBtn">Reset Quiz</button>
<section id="results" class="results hidden" aria-live="polite"></section></div>
<script>
const questions = [{"q": "What is the main function of a financial market?", "options": ["Connect lender-savers with borrower-spenders", "Print money for businesses", "Collect taxes for government", "Guarantee profits for investors"], "answer": 0, "explanation": "Financial markets transfer funds from savers to people or businesses that need to borrow."}, {"q": "What is direct finance?", "options": ["Funds move through a bank only", "Borrowers raise funds directly from lenders by issuing securities", "Government gives every business a grant", "A company uses only retained profits"], "answer": 1, "explanation": "Direct finance connects borrowers and lenders through securities such as bonds or shares."}, {"q": "Which is an example of indirect finance?", "options": ["A company sells new shares directly", "A saver buys a company's bond directly", "A bank accepts deposits and lends to a borrower", "Two investors trade existing shares"], "answer": 2, "explanation": "A bank acts as a financial intermediary between savers and borrowers."}, {"q": "What does buying a share usually represent?", "options": ["Ownership in a company", "A guaranteed repayment date", "A bank deposit", "A short-term government loan"], "answer": 0, "explanation": "Equity represents ownership and normally has no fixed maturity date."}, {"q": "What is a primary market?", "options": ["A market for used goods", "A market where newly issued securities are sold to first buyers", "A market only for foreign currencies", "A market where only existing securities are resold"], "answer": 1, "explanation": "Primary markets deal with newly issued securities."}, {"q": "What happens in a secondary market?", "options": ["Only new securities are issued", "The issuer gets money every time a share trades", "Existing securities are traded between investors", "Banks accept savings deposits"], "answer": 2, "explanation": "Secondary markets let investors trade securities that have already been issued."}, {"q": "What is one major benefit of a secondary market?", "options": ["It removes all investment risk", "It guarantees dividends", "It replaces all banks", "It provides liquidity and helps discover prices"], "answer": 3, "explanation": "Trading helps investors sell existing securities and establishes market prices."}, {"q": "What does an investment bank commonly do when a company issues new securities?", "options": ["Underwrites the issue", "Insures every bank deposit", "Sets stock prices permanently", "Collects utility bills"], "answer": 0, "explanation": "Investment banks can help structure and underwrite new securities issues."}, {"q": "How does a broker differ from a dealer?", "options": ["A broker always lends its own money", "A broker matches buyers and sellers as an agent", "A broker is always the issuer", "A broker guarantees a security's value"], "answer": 1, "explanation": "A broker acts as an agent; a dealer trades securities for its own account."}, {"q": "What is an over-the-counter (OTC) market?", "options": ["One organized exchange building only", "A market for cash and coins only", "Trading through a network of dealers", "A government department that prints securities"], "answer": 2, "explanation": "OTC trading takes place through a dealer network."}, {"q": "What best describes the money market in the notes?", "options": ["Mainly short-term debt securities with maturity up to one year", "Only shares with no maturity", "Only long-term bonds over ten years", "Only property and land"], "answer": 0, "explanation": "The money market mainly deals in short-term debt instruments, generally maturing within one year."}, {"q": "Which is generally associated with the capital market?", "options": ["Only checking accounts", "Long-term securities and equities", "Only currency notes", "Only loans due tomorrow"], "answer": 1, "explanation": "The capital market includes longer-term securities and shares."}, {"q": "What is a financial intermediary?", "options": ["A company that never handles money", "A government tax collector", "A middleman between savers and borrowers", "A buyer of goods for personal use"], "answer": 2, "explanation": "Financial intermediaries channel funds between savers and borrowers."}, {"q": "What does risk sharing by intermediaries help investors do?", "options": ["Avoid every possible loss", "Spread exposure across different assets or borrowers", "Guarantee a fixed stock price", "Remove the need for information"], "answer": 1, "explanation": "Pooling and diversification can spread risk, but do not eliminate all risk."}, {"q": "What is asymmetric information?", "options": ["Both parties know exactly the same things", "Prices never change", "One party has more or better information than the other", "A market with no buyers"], "answer": 2, "explanation": "Asymmetric information means information is unevenly distributed between parties."}, {"q": "When does adverse selection mainly arise?", "options": ["Before a transaction", "Only after a borrower spends the money", "Only when an exchange closes", "After a dividend is paid"], "answer": 0, "explanation": "Adverse selection is an information problem that occurs before a transaction."}, {"q": "When does moral hazard mainly arise?", "options": ["Before any agreement is considered", "After a transaction, when behavior may change", "Only when shares are first issued", "Whenever a market opens"], "answer": 1, "explanation": "Moral hazard concerns actions taken after an agreement or transaction."}, {"q": "Which institution is a depository institution?", "options": ["Life insurance company", "Pension fund", "Commercial bank", "Mutual fund"], "answer": 2, "explanation": "Commercial banks accept deposits and make loans, so they are depository institutions."}, {"q": "Which institution pools money to invest in a portfolio of securities?", "options": ["Mutual fund", "Credit union only", "Insurance regulator", "Stock exchange broker"], "answer": 0, "explanation": "Mutual funds pool investors' money to buy investment portfolios."}, {"q": "A credit union is typically owned by whom?", "options": ["Foreign governments", "Its members", "Stock exchanges", "All companies borrowing from it"], "answer": 1, "explanation": "Credit unions are generally member-owned institutions."}, {"q": "What do contractual savings institutions include?", "options": ["Only commercial banks", "Only stockbrokers", "Life insurers and pension funds", "Only investment banks"], "answer": 2, "explanation": "Life insurers and pension funds collect savings under contractual arrangements."}, {"q": "What is a common role of a finance company?", "options": ["Issuing national currency", "Supervising all stock exchanges", "Guaranteeing every investment", "Lending to consumers and businesses"], "answer": 3, "explanation": "Finance companies commonly provide consumer and business loans."}, {"q": "What is a key role of an investment bank?", "options": ["Helping issue securities and advising on mergers and acquisitions", "Accepting every household's checking deposits", "Setting the central bank's reserve requirement", "Insuring all deposits"], "answer": 0, "explanation": "Investment banks help firms raise capital and may advise on mergers and acquisitions."}, {"q": "Why do regulators require financial disclosure?", "options": ["To make all investments risk-free", "To give investors useful information for decisions", "To stop all securities trading", "To guarantee company profits"], "answer": 1, "explanation": "Disclosure of sales, assets, and earnings helps investors make informed decisions."}, {"q": "What is deposit insurance intended to help prevent?", "options": ["All stock-price declines", "All business losses", "Bank runs by protecting covered depositors", "All interest-rate changes"], "answer": 2, "explanation": "Deposit insurance can reduce the incentive for covered depositors to rush to withdraw funds."}, {"q": "What is a reserve requirement?", "options": ["The fraction of deposits a bank must hold as reserves", "A rule that banks must lend all deposits", "Interest paid on every share", "A limit on company owners"], "answer": 0, "explanation": "Reserve requirements specify a fraction of deposits that must be held as reserves."}, {"q": "What is Pakistan's central bank called?", "options": ["SECP", "State Bank of Pakistan (SBP)", "Pakistan Stock Exchange (PSX)", "Federal Board of Revenue (FBR)"], "answer": 1, "explanation": "The State Bank of Pakistan is Pakistan's central bank."}, {"q": "Which is the Eurocurrency example used in the notes?", "options": ["Euros deposited only in Germany", "Any currency exchanged for euros", "US dollars deposited in London", "A bond issued only by the European Union"], "answer": 2, "explanation": "US dollars deposited outside the United States, such as in London, are called Eurodollars."}, {"q": "As described in the notes, what is a Eurobond?", "options": ["A bond that must be denominated in euros", "A bond sold only inside its currency's home country", "A share traded only on PSX", "A bond denominated in one currency but sold in a different market"], "answer": 3, "explanation": "A Eurobond is defined by the market where it is sold, not necessarily by being denominated in euros."}, {"q": "What is the main purpose of financial regulation?", "options": ["Support safer and more efficient markets and institutions", "Ensure every investor makes a profit", "Eliminate the need for banks", "Stop companies from raising capital"], "answer": 0, "explanation": "Regulation aims to improve information, promote sound intermediaries, and support monetary control."}];
const quiz=document.getElementById('quiz'), results=document.getElementById('results'), submitBtn=document.getElementById('submitBtn');
function render(){quiz.innerHTML='';results.innerHTML='';results.classList.add('hidden');submitBtn.disabled=false;
questions.forEach((q,i)=>{const s=document.createElement('section');s.className='question';s.id='q'+i;
const t=document.createElement('div');t.className='qtitle';t.textContent=(i+1)+'. '+q.q;s.appendChild(t);
q.options.forEach((o,j)=>{const l=document.createElement('label');l.className='option';const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;
r.addEventListener('change',updateProgress);const txt=document.createElement('span');txt.textContent=o;const m=document.createElement('span');m.className='mark';m.dataset.mark='1';l.append(r,txt,m);s.appendChild(l);});quiz.appendChild(s);});
updateProgress();}
function updateProgress(){let n=0;questions.forEach((q,i)=>{if(document.querySelector('input[name="q'+i+'"]:checked'))n++;});
document.getElementById('progressText').textContent=n+' of '+questions.length+' answered';document.getElementById('bar').style.width=(n/questions.length*100)+'%';}
submitBtn.addEventListener('click',()=>{let score=0,blank=0;
questions.forEach((q,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked'),sel=c?Number(c.value):-1;if(sel<0)blank++;if(sel===q.answer)score++;
document.getElementById('q'+i).querySelectorAll('.option').forEach((l,j)=>{l.classList.remove('correct','incorrect');const m=l.querySelector('[data-mark]');m.textContent='';m.className='mark';
if(j===q.answer){l.classList.add('correct');m.textContent='✓ Correct answer';m.classList.add('green');}
if(j===sel&&sel!==q.answer){l.classList.add('incorrect');m.textContent='✗ Your answer';m.classList.add('red');}l.querySelector('input').disabled=true;});});
results.innerHTML='<h2>Your Results</h2><div class="score">'+score+' / '+questions.length+' ('+Math.round(score/questions.length*100)+'%)</div><p><span class="pill '+(score/questions.length>=.5?'pass':'fail')+'">'+(score/questions.length>=.5?'Good work—keep revising!':'Keep practicing—you can improve!')+'</span></p><p>You left '+blank+' question(s) unanswered. Review every answer below.</p>';
questions.forEach((q,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked'),sel=c?Number(c.value):-1;const row=document.createElement('div');row.className='resultrow';
const h=document.createElement('strong');h.textContent=(i+1)+'. '+q.q;row.appendChild(h);
const st=document.createElement('span');st.className='pill '+(sel===q.answer?'pass':'fail');st.textContent=sel===q.answer?'✓ Correct':'✗ Incorrect / unanswered';row.appendChild(st);
const yours=document.createElement('div');yours.textContent='Your answer: '+(sel<0?'Not answered':q.options[sel]);row.appendChild(yours);
const correct=document.createElement('div');const b=document.createElement('b');b.className='green';b.textContent='✓ Correct answer: ';correct.append(b,document.createTextNode(q.options[q.answer]));row.appendChild(correct);
const ex=document.createElement('div');ex.className='muted';ex.textContent='Explanation: '+q.explanation;row.appendChild(ex);results.appendChild(row);});
results.classList.remove('hidden');submitBtn.disabled=true;results.scrollIntoView({behavior:'smooth',block:'start'});});
document.getElementById('resetBtn').addEventListener('click',render);render();
</script></body></html>
